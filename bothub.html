<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bot Hub Builder</title>
<!--BOTHUB_INJECT-->
<style>
:root{--line:#dde2ea;--bg:#f3f5f9;--ink:#1b2430;--muted:#6b7686;--acc:#0f62fe;--ok:#1b7f4b;--warn:#b7791f;--err:#c53030}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;padding:.35rem .65rem;color:var(--ink)}
button:hover:not(:disabled){background:#eef2f8}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button.primary:hover:not(:disabled){background:#0b50d0}
button.danger{color:var(--err);border-color:#efc2c2}
button.icon{padding:.25rem .5rem}
input[type=text],input[type=url],input:not([type]),textarea{width:100%;font:inherit;padding:.4rem .5rem;border:1px solid var(--line);border-radius:6px;background:#fff}
textarea{resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
code{background:#eef1f6;padding:0 .3rem;border-radius:4px;font-size:12px}
.muted{color:var(--muted)}

#topbar{display:flex;align-items:center;gap:.5rem;padding:.45rem .75rem;background:#fff;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.brand{font-weight:700;margin-right:.5rem}
#crumbs{display:flex;gap:.2rem;align-items:center;color:var(--muted);overflow:hidden;white-space:nowrap}
#crumbs a{color:var(--acc);cursor:pointer}
.spacer{flex:1}
#status{font-size:12.5px;color:var(--muted)}
#status.dirty{color:var(--warn);font-weight:600}

#main{flex:1;display:flex;min-height:0}
.panel{display:flex;flex-direction:column;background:#fff;border-right:1px solid var(--line);flex:none;min-height:0;transition:width .15s}
#treePanel{width:270px}
#editPanel{width:440px}
.panel.collapsed{width:36px !important}
.panel-head{display:flex;align-items:center;gap:.4rem;padding:.4rem .5rem;border-bottom:1px solid var(--line);font-weight:600;min-height:40px}
.panel-head .ttl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel.collapsed .ttl,.panel.collapsed .panel-body,.panel.collapsed .extra{display:none}
.vlabel{display:none;writing-mode:vertical-rl;margin:.75rem auto;color:var(--muted);font-weight:600;font-size:12px}
.panel.collapsed .vlabel{display:block}
.panel.collapsed .panel-head{justify-content:center;padding:.4rem 0}
.panel-body{flex:1;overflow:auto;min-height:0}
#splitter{width:5px;cursor:col-resize;background:transparent;flex:none;margin-left:-3px;z-index:2}
#splitter:hover{background:rgba(15,98,254,.25)}
body.dragging iframe{pointer-events:none}
body.dragging{user-select:none}

/* tree */
.tn{display:flex;align-items:center;gap:.3rem;padding:.28rem .4rem;cursor:pointer;border-radius:5px;margin:1px 4px;white-space:nowrap}
.tn:hover{background:#eef2f8}
.tn.cur{background:#dfeaff;font-weight:600}
.tn.drop{outline:2px dashed var(--acc);background:#e8f0ff}
.tn .tw{width:14px;text-align:center;color:var(--muted)}
.tn .nm{overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.badge{display:inline-block;font-size:10.5px;padding:0 .4rem;border-radius:9px;background:#e8ecf3;color:#445;white-space:nowrap}
.badge.bot{background:#e2f4ea;color:var(--ok)}
.badge.hub{background:#e3ecff;color:#1a4fc4}
.badge.warn{background:#fff2d6;color:var(--warn)}
.badge.err{background:#fde3e3;color:var(--err)}
.badge.new{background:#ffe9a8;color:#7a5200;font-weight:700}
.treefoot{padding:.5rem .7rem;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}

/* editor */
.tabs{display:flex;gap:2px;position:sticky;top:0;background:#fff;z-index:3;border-bottom:1px solid var(--line);padding:.4rem .5rem 0}
.tab{border:none;border-bottom:3px solid transparent;border-radius:0;background:none;padding:.4rem .8rem}
.tab.on{border-bottom-color:var(--acc);font-weight:600}
.pad{padding:.7rem}
.banner{padding:.5rem .7rem;border-radius:8px;margin-bottom:.6rem;font-size:12.5px;background:#eaf1ff;border:1px solid #c9dbff}
.banner.warn{background:#fff6e0;border-color:#f3dba0}
.item{border:1px solid var(--line);border-radius:9px;margin-bottom:.45rem;background:#fff}
.item.sel{border-color:var(--acc);box-shadow:0 0 0 2px rgba(15,98,254,.15)}
.item.off .it-main{opacity:.55}
.item.dropt-before{box-shadow:0 -3px 0 var(--acc)}
.item.dropt-after{box-shadow:0 3px 0 var(--acc)}
.item-head{display:flex;align-items:center;gap:.4rem;padding:.4rem .5rem}
.grip{cursor:grab;color:var(--muted);padding:0 .2rem;user-select:none}
.it-main{flex:1;min-width:0;cursor:pointer}
.it-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it-sub{font-size:12px;color:var(--muted);display:flex;gap:.35rem;align-items:center;flex-wrap:wrap}
.eye{padding:.15rem .4rem;font-size:15px}
.eye.off{opacity:.45}
.item-body{border-top:1px solid var(--line);padding:.6rem;display:grid;gap:.5rem;background:#fafbfd;border-radius:0 0 9px 9px}
label.f{display:grid;gap:.15rem}
label.f>span{font-size:12px;color:var(--muted);font-weight:600}
label.chk{display:flex;gap:.4rem;align-items:center}
.btnrow{display:flex;gap:.4rem;flex-wrap:wrap}
.btnrow button{font-size:12.5px;padding:.25rem .55rem}
.fmtbar{display:flex;gap:.25rem;margin-bottom:.2rem}
.fmtbar button{padding:.05rem .45rem;font-size:12px}
.tplbtn{display:block;width:100%;text-align:left;margin-bottom:.4rem;padding:.55rem .7rem}
.tplbtn small{display:block;color:var(--muted);margin-top:.1rem}
.tplbtn.on{border-color:var(--acc);background:#eaf1ff}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin-bottom:.6rem}
.swatch{height:46px;padding:0;border-radius:8px;position:relative;overflow:hidden;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.swatch span{position:absolute;left:0;right:0;bottom:0;font-size:10px;background:rgba(255,255,255,.85);padding:1px}
.colrow{display:flex;align-items:center;gap:.5rem;margin:.25rem 0}
.colrow input[type=color]{width:38px;height:28px;padding:0;border:1px solid var(--line);border-radius:5px;background:#fff}
.colrow .hx{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--muted);margin-left:auto}
h4{margin:1rem 0 .4rem;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}

/* preview */
#previewPanel{flex:1;display:flex;flex-direction:column;min-width:0}
#pvbar{display:flex;gap:.4rem;align-items:center;padding:.4rem .6rem;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.seg{display:inline-flex}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:6px 0 0 6px;margin-left:0}
.seg button:last-child{border-radius:0 6px 6px 0}
.seg button.on{background:#dfeaff;border-color:var(--acc);position:relative}
#pvstage{flex:1;overflow:auto;display:flex;justify-content:center;padding:0;background:#d9dee7}
#frameWrap{width:100%;height:100%;transition:width .2s;background:#fff}
#frame{width:100%;height:100%;border:0;background:#fff;display:block}

/* modal + toast */
#modal{position:fixed;inset:0;background:rgba(15,20,30,.45);display:none;align-items:center;justify-content:center;z-index:50}
#modal.open{display:flex}
.mbox{background:#fff;border-radius:12px;width:min(520px,92vw);max-height:80vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mbox h3{margin:0;padding:.9rem 1rem;border-bottom:1px solid var(--line);font-size:16px}
#mBody{padding:.8rem 1rem;overflow:auto}
#mFoot{padding:.7rem 1rem;border-top:1px solid var(--line);display:flex;gap:.5rem;justify-content:flex-end}
.pick{display:grid;gap:.25rem}
.hubpick{text-align:left}
.hubpick.on{background:#dfeaff;border-color:var(--acc)}
#toasts{position:fixed;right:14px;bottom:14px;display:grid;gap:.4rem;z-index:60}
.toast{background:#1b2430;color:#fff;padding:.55rem .8rem;border-radius:8px;max-width:380px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.err{background:var(--err)}
.toast.ok{background:var(--ok)}
#bye{position:fixed;inset:0;background:#1b2430;color:#fff;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:100;text-align:center}
#bye.open{display:flex}
</style>
</head>
<body>
<header id="topbar">
  <button class="icon" data-collapse="treePanel" title="Show/hide folder panel">☰</button>
  <span class="brand">🤖 Bot Hub Builder</span>
  <div id="crumbs"></div>
  <div class="spacer"></div>
  <span id="status"></span>
  <button id="btnSave" class="primary" title="Ctrl+S">💾 Save</button>
  <button id="btnSaveAll">Save all</button>
  <button id="btnOpenSaved" title="Open the saved index.html in a new tab">↗ Saved page</button>
  <button id="btnOpenPreview" title="Open the current (unsaved) state in a new tab">↗ Preview</button>
  <button id="btnShutdown" class="danger">⏻ Shut down</button>
</header>

<div id="main">
  <aside class="panel" id="treePanel">
    <div class="panel-head"><span class="ttl">Folders</span>
      <button class="icon extra" id="btnRescan" title="Rescan disk">⟳</button>
      <button class="icon" data-collapse="treePanel" title="Collapse">«</button>
      <span class="vlabel">Folders</span></div>
    <div class="panel-body" id="tree"></div>
    <div class="treefoot extra" id="treeFoot"></div>
  </aside>

  <aside class="panel" id="editPanel">
    <div class="panel-head"><span class="ttl" id="editTitle">Editor</span>
      <button class="icon" data-collapse="editPanel" title="Collapse">«</button>
      <span class="vlabel">Editor</span></div>
    <div class="panel-body" id="editBody"></div>
  </aside>
  <div id="splitter" title="Drag to resize"></div>

  <section id="previewPanel">
    <div id="pvbar">
      <button class="icon" data-collapse="editPanel" title="Show/hide editor">✎ Editor</button>
      <div class="seg">
        <button id="vEdit" class="on" title="Click texts in the preview to edit them; hidden items shown dimmed">Edit view</button>
        <button id="vVisitor" title="Exactly what visitors will see">Visitor view</button>
      </div>
      <div class="seg">
        <button data-dev="desktop" class="on">🖥</button><button data-dev="tablet">▭</button><button data-dev="mobile">📱</button>
      </div>
      <button id="btnReload" class="icon" title="Reload preview">⟳</button>
      <span class="muted" id="pvHint">Tip: click a text in the preview to edit it directly.</span>
    </div>
    <div id="pvstage"><div id="frameWrap"><iframe id="frame" title="preview"></iframe></div></div>
  </section>
</div>

<div id="modal"><div class="mbox"><h3 id="mTitle"></h3><div id="mBody"></div><div id="mFoot"></div></div></div>
<div id="toasts"></div>
<div id="bye"><h2>Server stopped</h2><p>You can close this tab.</p></div>

<script>
"use strict";
const TOKEN = window.BOTHUB_TOKEN;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plain = h => { const d = document.createElement('div'); d.innerHTML = h || ''; return d.textContent.trim(); };
const join = (a, b) => a ? a + '/' + b : b;
const parentOf = p => p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : '';
const encPath = p => p.split('/').filter(Boolean).map(encodeURIComponent).join('/');
const keyOf = it => it.folder ? 'f:' + it.folder : 'h:' + it.href;
const serial = c => JSON.stringify(c, (k, v) => k[0] === '_' ? undefined : v);

const ICON = {root:'🏠', hub:'🗂️', bot:'🤖', page:'📄', noindex:'⚠️', link:'🔗'};
const PRESETS = {
  Ocean:{bg:'#f7f9fc',bg2:'#eef4ff',card:'#ffffff',accent:'#0f62fe',accent2:'#5aa8ff',text:'#0b1220',muted:'#586069'},
  Forest:{bg:'#f4f8f4',bg2:'#e4f1e6',card:'#ffffff',accent:'#1b7f4b',accent2:'#6cc58f',text:'#10201a',muted:'#51655a'},
  Sunset:{bg:'#fff8f3',bg2:'#ffe9dc',card:'#ffffff',accent:'#e4572e',accent2:'#ffa552',text:'#2a1710',muted:'#7a5c50'},
  Violet:{bg:'#f8f6ff',bg2:'#ece7ff',card:'#ffffff',accent:'#6b46e5',accent2:'#b18cff',text:'#17122b',muted:'#62597d'},
  Rose:{bg:'#fff5f8',bg2:'#ffe3ec',card:'#ffffff',accent:'#d6336c',accent2:'#ff8fb1',text:'#2b0f1a',muted:'#80566a'},
  Slate:{bg:'#f1f3f5',bg2:'#dee2e6',card:'#ffffff',accent:'#343a40',accent2:'#868e96',text:'#16191c',muted:'#5c6670'},
  Teal:{bg:'#f1fafa',bg2:'#d9f1f1',card:'#ffffff',accent:'#0f8b8d',accent2:'#5ad1c9',text:'#0c2222',muted:'#4f6a6a'},
  Midnight:{bg:'#0d1117',bg2:'#161b22',card:'#1c2330',accent:'#58a6ff',accent2:'#a371f7',text:'#e6edf3',muted:'#8b98a8'},
};
const PAL_LABELS = {bg:'Page background (top)',bg2:'Page background (bottom)',card:'Card / panel',accent:'Accent (links, bars)',accent2:'Accent 2 (gradient)',text:'Text',muted:'Muted text'};

const S = {info:null, tree:null, treeSig:'', cur:'', mode:'hub', hubs:{}, tab:'items', selKey:null,
           visitor:false, device:'desktop', collapsed:new Set(), drag:null, busy:false, pvSeq:0};

/* ---------------------------------------------------------------- api / ui helpers */
async function api(url, body) {
  const opt = {headers:{'X-Bothub-Token':TOKEN}};
  if (body !== undefined) { opt.method = 'POST'; opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  let r;
  try { r = await fetch('/api/' + url, opt); } catch (e) { throw new Error('Server not reachable (is bothub.py still running?)'); }
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
function toast(msg, type = '') {
  const t = document.createElement('div'); t.className = 'toast ' + type; t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), type === 'err' ? 7000 : 3500);
}
function modal({title, body, actions}) {
  $('#mTitle').textContent = title; $('#mBody').innerHTML = body; $('#mBody').onclick = null;
  const f = $('#mFoot'); f.innerHTML = '';
  actions.forEach(a => { const b = document.createElement('button'); b.textContent = a.label; b.className = a.cls || '';
    b.onclick = () => { if (a.fn) a.fn(); if (!a.keep) closeModal(); }; f.appendChild(b); });
  $('#modal').classList.add('open');
}
const closeModal = () => $('#modal').classList.remove('open');
const confirmBox = (title, body, label, fn) => modal({title, body, actions:[{label:'Cancel'},{label, cls:'primary', fn}]});

/* ---------------------------------------------------------------- state helpers */
const cfg = () => S.hubs[S.cur].config;
const isDirty = p => { const h = S.hubs[p]; return !!h && (h.snap === null || serial(h.config) !== h.snap); };
const dirtyPaths = () => Object.keys(S.hubs).filter(isDirty);
function findNode(path, n = S.tree) {
  if (!n) return null; if (n.path === path) return n;
  for (const c of n.children) { const r = findNode(path, c); if (r) return r; } return null;
}
function hubList() {
  const out = [];
  (function walk(n, d) { if (n.kind === 'root' || n.kind === 'hub') out.push({path:n.path, name:n.name, depth:d});
    n.children.forEach(c => walk(c, d + 1)); })(S.tree, 0);
  return out;
}
function setByPath(obj, path, v) {
  const ks = path.split('.'); let o = obj;
  for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]];
  o[ks[ks.length - 1]] = v;
}
async function loadHub(path, force) {
  if (S.hubs[path] && !force) return S.hubs[path];
  const r = await api('hub?path=' + encodeURIComponent(path));
  return S.hubs[path] = {config:r.config, source:r.source, removed:r.removed, snap:r.dirty_hint ? null : serial(r.config)};
}
async function mergeScan(path) {
  const r = await api('hub?path=' + encodeURIComponent(path));
  const h = S.hubs[path], fresh = r.config.items;
  const names = new Set(fresh.filter(i => i.folder).map(i => i.folder));
  const have = new Map(h.config.items.filter(i => i.folder).map(i => [i.folder, i]));
  const gone = [], added = [];
  h.config.items = h.config.items.filter(i => { if (i.folder && !names.has(i.folder)) { gone.push(i.folder); return false; } return true; });
  for (const fi of fresh) if (fi.folder) {
    const ex = have.get(fi.folder);
    if (ex) { ex._kind = fi._kind; ex._js = fi._js; }
    else { h.config.items.push(fi); added.push(fi.folder); }
  }
  if (gone.length) h.removed = [...new Set([...(h.removed || []), ...gone])];
  return {added, gone};
}
async function rescanAll(force) {
  const t = await api('tree'); const sig = JSON.stringify(t.tree);
  if (sig === S.treeSig && !force) return false;
  S.tree = t.tree; S.treeSig = sig;
  const added = []; let changed = false;
  for (const p of Object.keys(S.hubs)) {
    try { const r = await mergeScan(p); r.added.forEach(n => added.push(join(p, n))); if (r.added.length || r.gone.length) changed = true; }
    catch (e) { delete S.hubs[p]; }
  }
  const n = findNode(S.cur);
  if (!n) { S.cur = ''; S.mode = 'hub'; }
  else if (S.mode === 'folder' && (n.kind === 'hub' || n.kind === 'root')) S.mode = 'hub';
  if (S.mode === 'hub' && !S.hubs[S.cur]) await loadHub(S.cur);
  renderAll();
  if (changed || !n) refreshPreview();
  if (added.length) toast('New folder detected: ' + added.join(', '), 'ok');
  return true;
}

/* ---------------------------------------------------------------- navigation */
function navigateTo(path) {
  const n = findNode(path); if (!n) return;
  if (n.kind === 'root' || n.kind === 'hub') openHub(path);
  else if (n.kind === 'bot') openHub(parentOf(path), 'f:' + n.name);
  else openFolder(path);
}
async function openHub(path, selKey = null) {
  try { await loadHub(path); } catch (e) { return toast(e.message, 'err'); }
  S.cur = path; S.mode = 'hub'; S.selKey = selKey; if (selKey) S.tab = 'items';
  renderAll(); refreshPreview();
}
function openFolder(path) { S.cur = path; S.mode = 'folder'; S.selKey = null; renderAll(); refreshPreview(); }

/* ---------------------------------------------------------------- rendering: tree / crumbs / status */
function renderAll() { renderTree(); renderCrumbs(); renderEditor(); updateStatus(); }
function renderTree() {
  const el = $('#tree'); el.innerHTML = ''; if (!S.tree) return;
  el.appendChild(nodeEl(S.tree, 0));
}
const KIND_BADGE = {noindex:'<span class="badge err">no index.html</span>', page:'<span class="badge warn">index only</span>'};
function nodeEl(n, depth) {
  const wrap = document.createElement('div'), row = document.createElement('div');
  row.className = 'tn k-' + n.kind + (n.path === S.cur ? ' cur' : '');
  row.dataset.path = n.path; row.dataset.kind = n.kind; row.style.paddingLeft = (6 + depth * 14) + 'px';
  const kids = n.children.length > 0;
  row.innerHTML = `<span class="tw" data-act="tw">${kids ? (S.collapsed.has(n.path) ? '▸' : '▾') : ''}</span>
    <span>${ICON[n.kind]}</span><span class="nm">${esc(n.name)}</span>${KIND_BADGE[n.kind] || ''}${isDirty(n.path) ? '<span class="dot" title="unsaved changes"></span>' : ''}`;
  wrap.appendChild(row);
  if (kids && !S.collapsed.has(n.path)) n.children.forEach(c => wrap.appendChild(nodeEl(c, depth + 1)));
  return wrap;
}
function renderCrumbs() {
  const parts = S.cur ? S.cur.split('/') : []; let acc = '';
  let h = `<a data-p="">${esc(S.info?.name || 'root')}</a>`;
  parts.forEach(p => { acc = join(acc, p); h += ` / <a data-p="${esc(acc)}">${esc(p)}</a>`; });
  $('#crumbs').innerHTML = h;
}
function updateStatus() {
  const d = dirtyPaths(), el = $('#status');
  el.textContent = d.length ? `● ${d.length} hub${d.length > 1 ? 's' : ''} with unsaved changes` : '✓ all saved';
  el.className = d.length ? 'dirty' : '';
  document.title = (d.length ? '● ' : '') + 'Bot Hub Builder';
  $('#btnSave').disabled = S.mode !== 'hub';
  $('#btnSaveAll').disabled = !d.length;
  $('#btnOpenPreview').disabled = S.mode !== 'hub';
}
function touch(opts = {}) {
  updateStatus(); renderTree();
  if (!opts.noPreview) schedulePreview();
}

/* ---------------------------------------------------------------- rendering: editor */
function renderEditor() {
  const body = $('#editBody'), sc = body.scrollTop;
  if (S.mode === 'folder') { $('#editTitle').textContent = 'Folder: /' + S.cur; body.innerHTML = folderHTML(); }
  else { $('#editTitle').textContent = 'Editing hub: /' + S.cur; body.innerHTML = hubHTML(); }
  body.scrollTop = sc;
}
function hubHTML() {
  const h = S.hubs[S.cur]; const names = {items:'Items', page:'Page', style:'Style'};
  let o = `<div class="tabs">${Object.keys(names).map(t => `<button class="tab ${S.tab === t ? 'on' : ''}" data-act="tab" data-v="${t}">${names[t]}</button>`).join('')}</div><div class="pad">`;
  if (h.source === 'legacy') o += `<div class="banner">Imported from your existing <code>index.html</code>. Saving regenerates it in Bot Hub format (the old file is backed up in <code>.bothub_backups</code>).</div>`;

    `<p>Move <code>/${esc(join(srcHub, folder))}</code> to <code>/${esc(dest)}</code>?</p>
     <p class="muted">The whole folder moves on disk, together with its button, title and description. Both hub pages are saved immediately. Bots that use absolute URLs (starting with “/”) may need adjusting.</p>`,

  const hubs = hubList().filter(x => x.path !== S.cur && x.path !== srcRel && !x.path.startsWith(srcRel + '/'));
  modal({title:`Move “${it.folder}” to…`,
    body:`<p class="muted">Pick the hub that should contain this folder. Its button, title and description move with it.</p><div class="pick">${hubs.map(x =>
      `<button class="hubpick" data-p="${esc(x.path)}" style="padding-left:${10 + x.depth * 14}px">${ICON[x.path === '' ? 'root' : 'hub']} ${esc(x.path === '' ? S.info.name + ' (root)' : x.name)} <small class="muted">/${esc(x.path)}</small></button>`).join('')
      || '<em>No other hub available. Turn a folder into a hub first.</em>'}</div>`,
    actions:[{label:'Cancel'}, {label:'Move here', cls:'primary', keep:true, fn:() => {

  $('#mBody').onclick = e => { const b = e.target.closest('.hubpick'); if (!b) return; $$('.hubpick').forEach(x => x.classList.remove('on')); b.classList.add('on'); dest = b.dataset.p; };
}
async function doMove(srcHub, folder, destHub) {
  S.busy = true;
  try {
    const sh = S.hubs[srcHub], idx = sh.config.items.findIndex(x => x.folder === folder), srcRel = join(srcHub, folder);
    const bad = dirtyPaths().find(p => p === srcRel || p.startsWith(srcRel + '/'));
    if (bad) throw new Error(`Hub “/${bad}” has unsaved changes – save it first.`);
    const dh = await loadHub(destHub);
    await api('move', {src:srcRel, dest:destHub});
    Object.keys(S.hubs).forEach(p => { if (p === srcRel || p.startsWith(srcRel + '/')) delete S.hubs[p]; });
    const [item] = sh.config.items.splice(idx, 1); delete item._new;
    dh.config.items.push(item);
    await saveHub(srcHub); await saveHub(destHub);
    if (S.cur === srcRel || S.cur.startsWith(srcRel + '/')) { S.cur = srcHub; S.mode = 'hub'; }
    S.selKey = null;
    await rescanAll(true);
    toast(`Moved to /${join(destHub, folder)} (appended at the end of that hub)`, 'ok');

}

    sendHighlight();
  } else if (d.type === 'edit') {
    let html = d.html === '<br>' ? '' : d.html;
    if (d.i !== null) { if (items[d.i]) items[d.i][d.f] = html; } else cfg().page[d.f] = html;
    touch({noPreview:true});
    clearTimeout(edTimer);
    edTimer = setTimeout(() => { const a = document.activeElement; if (!(a && editBody.contains(a) && /INPUT|TEXTAREA/.test(a.tagName))) renderEditor(); }, 500);
  }
});
$('#vEdit').onclick = () => setVisitor(false);
$('#vVisitor').onclick = () => setVisitor(true);
function setVisitor(v) { S.visitor = v; $('#vEdit').classList.toggle('on', !v); $('#vVisitor').classList.toggle('on', v); refreshPreview(); }
$$('[data-dev]').forEach(b => b.onclick = () => {
  $$('[data-dev]').forEach(x => x.classList.remove('on')); b.classList.add('on');
  $('#frameWrap').style.width = {desktop:'100%', tablet:'768px', mobile:'390px'}[b.dataset.dev];
});
$('#btnReload').onclick = () => refreshPreview();

/* ---------------------------------------------------------------- top bar buttons */
$('#btnSave').onclick = saveCurrent;
$('#btnSaveAll').onclick = saveAll;
$('#btnRescan').onclick = ACTIONS.rescan;
$('#btnOpenSaved').onclick = () => window.open('/site/' + encPath(S.cur) + (S.cur ? '/' : '') + 'index.html', '_blank');
$('#btnOpenPreview').onclick = async () => {
  if (S.mode !== 'hub') return;
  const w = window.open('', '_blank');
  try {
    const r = await api('render', {path:S.cur, config:cfg(), edit:false, base:baseUrl(S.cur)});
    w.document.open(); w.document.write(r.html); w.document.close();
  } catch (e) { if (w) w.close(); toast(e.message, 'err'); }
};
$('#btnShutdown').onclick = () => {
  const d = dirtyPaths();
  confirmBox('Shut down server?', d.length ? `<p><b>${d.length} hub(s) have unsaved changes</b> that will be lost.</p>` : '<p>The local server will stop.</p>', 'Shut down', async () => {
    try { await api('shutdown', {}); } catch (e) {}
    window.onbeforeunload = null; $('#bye').classList.add('open');
  });
};
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveCurrent(); } });
window.onbeforeunload = e => { if (dirtyPaths().length) { e.preventDefault(); e.returnValue = ''; } };

/* ---------------------------------------------------------------- panels */
$$('[data-collapse]').forEach(b => b.addEventListener('click', () => {
  const p = $('#' + b.dataset.collapse); p.classList.toggle('collapsed');
  localStorage.setItem('bh.' + p.id, p.classList.contains('collapsed') ? '1' : '');
  const x = p.querySelector('.panel-head button[data-collapse]'); if (x) x.textContent = p.classList.contains('collapsed') ? '»' : '«';
}));
['treePanel', 'editPanel'].forEach(id => { if (localStorage.getItem('bh.' + id)) { const p = $('#' + id); p.classList.add('collapsed'); const x = p.querySelector('.panel-head button[data-collapse]'); if (x) x.textContent = '»'; } });
if (localStorage.getItem('bh.editW')) $('#editPanel').style.width = localStorage.getItem('bh.editW');
(function () {
  const sp = $('#splitter'), ep = $('#editPanel'); let drag = false;
  sp.addEventListener('mousedown', e => { drag = true; document.body.classList.add('dragging'); e.preventDefault(); });
  window.addEventListener('mousemove', e => { if (drag) ep.style.width = Math.max(320, Math.min(900, e.clientX - ep.getBoundingClientRect().left)) + 'px'; });
  window.addEventListener('mouseup', () => { if (drag) { drag = false; document.body.classList.remove('dragging'); localStorage.setItem('bh.editW', ep.style.width); } });
})();

/* ---------------------------------------------------------------- init + polling */
(async function init() {
  try {
    S.info = await api('info');
    $('#treeFoot').innerHTML = S.info.ignored.length ? 'Ignored in root: ' + S.info.ignored.map(f => `<code>${esc(f)}</code>`).join(' ') : '';
    const t = await api('tree'); S.tree = t.tree; S.treeSig = JSON.stringify(t.tree);
    await openHub('');
  } catch (e) { toast(e.message, 'err'); }
  setInterval(async () => {
    if (document.hidden || S.busy || !S.tree) return;
    try { await rescanAll(false); } catch (e) {}
  }, 4000);
})();
</script>
